# Polaris's secrets config for Betterleaks: the pinned built-in rules, plus filters.
# Passed with --config on every scan; a scanned repo's own config is never loaded.
title = "Polaris secrets"

# Low-confidence generic matches in translation catalogues are labels, not credentials.
filter = '''
finding["confidence"] == "low" &&
matchesAny(attributes["path"], [`(?i)(^|/)(locales?|i18n|lang|translations|messages)/`])
'''

[extend]
useDefault = true
