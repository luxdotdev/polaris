id: py-eval
language: python
severity: error
message: eval/exec runs a string as code
note: "Code built from a string runs with the program's full rights. Use ast.literal_eval for literals, or dispatch on a known set."
metadata: { polaris-severity: Critical, category: security }
rule:
  any:
    - pattern: eval($$$)
    - pattern: exec($$$)
---
id: py-shell-true
language: python
severity: error
message: subprocess with shell=True passes the command through a shell
note: "With shell=True the command goes through a shell, where untrusted text can run commands. Pass a list of arguments without shell=True."
metadata: { polaris-severity: High, category: security }
rule:
  kind: call
  all:
    - has: { field: function, regex: '^subprocess\.' }
    - has:
        field: arguments
        has: { kind: keyword_argument, regex: '^shell\s*=\s*True$' }
---
id: py-os-system
language: python
severity: warning
message: os.system runs its argument through a shell
note: "The argument runs through a shell. Use subprocess.run with a list of arguments."
metadata: { polaris-severity: High, category: security }
rule:
  any:
    - pattern: os.system($$$)
    - pattern: os.popen($$$)
---
id: py-unsafe-deserialization
language: python
severity: error
message: Deserialising untrusted data can execute code
note: "Loading pickle, marshal or full YAML from untrusted data can run code. Use JSON, or yaml.safe_load."
metadata: { polaris-severity: Critical, category: security }
rule:
  any:
    - pattern: pickle.loads($$$)
    - pattern: pickle.load($$$)
    - pattern: yaml.load($X)
    - pattern: yaml.unsafe_load($$$)
    - pattern: marshal.loads($$$)
---
id: py-tls-verification-off
language: python
severity: error
message: TLS certificate verification is turned off
note: "Without certificate checks, anyone on the network path can impersonate the server. Point verify at the right CA bundle instead."
metadata: { polaris-severity: Critical, category: security }
rule:
  kind: keyword_argument
  regex: '^verify\s*=\s*False$'
---
id: py-sql-format
language: python
severity: error
message: SQL built with string formatting can be injected
note: "Values formatted into SQL can change the query. Pass them as parameters to execute."
metadata: { polaris-severity: Critical, category: security }
rule:
  kind: call
  all:
    - has: { field: function, regex: '\.execute(many)?$' }
    - has:
        field: arguments
        has:
          nthChild: 1
          any:
            - { kind: string, has: { kind: interpolation } }
            - { kind: binary_operator }
            - { kind: call, has: { field: function, regex: '\.format$' } }
---
id: py-weak-hash
language: python
severity: warning
message: MD5 and SHA-1 are broken for security uses
note: "MD5 and SHA-1 collisions are practical. For a non-security checksum, say so with usedforsecurity=False."
metadata: { polaris-severity: Medium, category: security }
rule:
  any:
    - pattern: hashlib.md5($$$)
    - pattern: hashlib.sha1($$$)
  not: { regex: 'usedforsecurity\s*=\s*False' }
---
id: py-bare-except
language: python
severity: hint
message: A bare except swallows every error, including KeyboardInterrupt
note: "It also catches KeyboardInterrupt and SystemExit and hides real bugs. Catch the exceptions you expect."
metadata: { polaris-severity: Low, category: correctness }
rule:
  kind: except_clause
  regex: '^except\s*:'
