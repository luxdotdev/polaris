name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.13

jobs:
  check:
    name: Lint, typecheck, test, licences (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the execve hand-off proof on the platform it matters most on.
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # oxlint's JS plugin host runs on Node; the anti-slop plugin is TypeScript (type stripping, Node >= 22.18).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # oxfmt format check, then oxlint through the ratchet (tooling/lint/baseline.json):
      # fails on new or increased violations. See packages/lint-config/README.md.
      - run: bun run lint
      - run: bunx turbo run typecheck test
      - name: Typecheck and test scripts
        run: bunx tsc -p scripts && bun test scripts
      - run: bun run licenses:check

  spec:
    name: Spec (Quint), trace validation, Apalache
    # packages/spec/README.md. The model-based tests themselves run in `check`.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Quint typecheck, scenario tests, simulation (fixed seed)
        run: bun run spec
      - name: Trace validation (Engine runs replayed through the spec)
        run: |
          (cd apps/daemon && POLARIS_TRACE_DIR="$RUNNER_TEMP/traces" POLARIS_PBT_RUNS=30 \
            bun test src/verification/engine.model.test.ts)
          (cd packages/spec && bun scripts/replay.ts "$RUNNER_TEMP/traces")
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Apalache, bounded (report only)
        # Exhaustive up to 3 steps of the small instance (~40 s); deeper bounds take
        # minutes to hours, see the README's numbers. Report only until it has a track
        # record on shared runners.
        continue-on-error: true
        working-directory: packages/spec
        run: ./node_modules/.bin/quint verify polaris.qnt --main=small --invariant=safety --max-steps=3 --verbosity=1

  build-daemon:
    name: Build the Daemon
    # darwin builds must be re-signed with macOS codesign; the Linux targets cross-compile.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Also installs the other platforms' optional packages (fff-bin-*) so their
      # native libraries can be embedded, and runs `polaris selftest` on darwin.
      - run: bunx turbo run build --filter=@polaris/daemon
      - uses: actions/upload-artifact@v4
        with:
          name: polaris-daemon
          path: apps/daemon/dist/
          if-no-files-found: error

  smoke-linux:
    name: Smoke-test ${{ matrix.platform }}
    needs: build-daemon
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: polaris-daemon
          path: dist
      - name: Run polaris selftest (embedded fff loads) and check the manifest hash
        run: |
          chmod +x dist/${{ matrix.platform }}/polaris dist/${{ matrix.platform }}/betterleaks
          dist/${{ matrix.platform }}/polaris version | grep -x "polaris .* ${{ matrix.platform }}"
          dist/${{ matrix.platform }}/polaris selftest
          expected=$(jq -r '.platforms["${{ matrix.platform }}"].sha256' dist/manifest.json)
          echo "$expected  dist/${{ matrix.platform }}/polaris" | sha256sum -c -

  bench:
    name: Daemon benchmarks (quick; memory gated)
    # Runs the real Daemon (from source) through every scenario at --quick sizes and posts the
    # numbers to the job summary. Memory gates against packages/bench/baselines/
    # ci-ubuntu-latest-quick.json, the median of four runner results on AMD EPYC 7763 (most
    # runners); a run on another CPU model reports without gating (--gate-same-machine).
    # Latency and CPU never gate: shared runners are too noisy. To refresh the baseline, see
    # packages/bench/README.md ("CI").
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Run benchmarks
        run: |
          bun run bench --quick --json bench-result.json --markdown "$GITHUB_STEP_SUMMARY" \
            --compare packages/bench/baselines/ci-ubuntu-latest-quick.json \
            --fail-on memory --gate-same-machine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-result
          path: bench-result.json
          if-no-files-found: warn

  desktop-budgets:
    name: Desktop budgets (memory, Workspace switch, frames)
    # The built Desktop App under Xvfb against a Daemon on the bench Harness
    # (apps/desktop/scripts/budgets.ts): a heavy session (25 Turns × 60 items × 6 KB) must
    # keep the app plus the Daemon under 1 GB, a Workspace switch under 100 ms (p95), and
    # streaming frames paced to the display (Xvfb's refresh here, not 120 Hz).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Playwright's Electron launcher runs under Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Electron's runtime libraries and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libgbm1 libasound2t64 \
            libgtk-3-0t64 libxss1 libxtst6
      - run: bun run --cwd apps/desktop build
      - name: Budgets
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            node apps/desktop/scripts/budgets.ts --json desktop-budgets.json \
            --markdown "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-budgets
          path: desktop-budgets.json
          if-no-files-found: warn
