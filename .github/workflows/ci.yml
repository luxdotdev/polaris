name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.13

jobs:
  check:
    name: Lint, typecheck, test, licences (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the execve hand-off proof on the platform it matters most on.
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx turbo run typecheck test
      - name: Typecheck and test scripts
        run: bunx tsc -p scripts && bun test scripts
      - run: bun run licenses:check

  build-daemon:
    name: Build the Daemon
    # darwin builds must be re-signed with macOS codesign; the Linux targets cross-compile.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@polaris/daemon
      - name: Smoke-test the darwin build
        run: apps/daemon/dist/darwin-arm64/polaris version
      - uses: actions/upload-artifact@v4
        with:
          name: polaris-daemon
          path: apps/daemon/dist/
          if-no-files-found: error

  smoke-linux:
    name: Smoke-test ${{ matrix.platform }}
    needs: build-daemon
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: polaris-daemon
          path: dist
      - name: Run polaris version and check the manifest hash
        run: |
          chmod +x dist/${{ matrix.platform }}/polaris
          dist/${{ matrix.platform }}/polaris version | grep -x "polaris .* ${{ matrix.platform }}"
          expected=$(jq -r '.platforms["${{ matrix.platform }}"].sha256' dist/manifest.json)
          echo "$expected  dist/${{ matrix.platform }}/polaris" | sha256sum -c -

  # memory-bench: placeholder. Once the Desktop App exists (apps/desktop), add a
  # job that launches it against a local Daemon with N Agent Sessions and fails
  # when resident memory of the Desktop App or Daemon exceeds the budget.
