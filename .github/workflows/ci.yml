name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.13

jobs:
  check:
    name: Lint, typecheck, test, licences (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the execve hand-off proof on the platform it matters most on.
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # oxlint's JS plugin host runs on Node; the anti-slop plugin is TypeScript (type stripping, Node >= 22.18).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Biome format check, then oxlint through the ratchet (tooling/lint/baseline.json):
      # fails on new or increased violations. See packages/lint-config/README.md.
      - run: bun run lint
      - run: bunx turbo run typecheck test
      - name: Typecheck and test scripts
        run: bunx tsc -p scripts && bun test scripts
      - run: bun run licenses:check

  build-daemon:
    name: Build the Daemon
    # darwin builds must be re-signed with macOS codesign; the Linux targets cross-compile.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Also installs the other platforms' optional packages (fff-bin-*) so their
      # native libraries can be embedded, and runs `polaris selftest` on darwin.
      - run: bunx turbo run build --filter=@polaris/daemon
      - uses: actions/upload-artifact@v4
        with:
          name: polaris-daemon
          path: apps/daemon/dist/
          if-no-files-found: error

  smoke-linux:
    name: Smoke-test ${{ matrix.platform }}
    needs: build-daemon
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: polaris-daemon
          path: dist
      - name: Run polaris selftest (embedded fff loads) and check the manifest hash
        run: |
          chmod +x dist/${{ matrix.platform }}/polaris
          dist/${{ matrix.platform }}/polaris version | grep -x "polaris .* ${{ matrix.platform }}"
          dist/${{ matrix.platform }}/polaris selftest
          expected=$(jq -r '.platforms["${{ matrix.platform }}"].sha256' dist/manifest.json)
          echo "$expected  dist/${{ matrix.platform }}/polaris" | sha256sum -c -

  bench:
    name: Daemon benchmarks (quick, report only)
    # Runs the real Daemon (from source) through every scenario at --quick sizes and
    # posts the numbers to the job summary. Report only for now: shared runners are
    # too noisy to gate latency, and there is no baseline recorded on this runner yet.
    # To gate memory, commit a baseline from this job's artifact as
    # packages/bench/baselines/ci-ubuntu-latest-quick.json (see packages/bench/README.md):
    # the step below then fails on memory regressions beyond tolerance.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Run benchmarks
        run: |
          baseline=packages/bench/baselines/ci-ubuntu-latest-quick.json
          if [ -f "$baseline" ]; then
            bun run bench --quick --json bench-result.json --markdown "$GITHUB_STEP_SUMMARY" \
              --compare "$baseline" --fail-on memory
          else
            bun run bench --quick --json bench-result.json --markdown "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-result
          path: bench-result.json
          if-no-files-found: warn

  # Desktop App memory budget: once apps/desktop exists, add a scenario that launches
  # it against a local Daemon with N Agent Sessions and samples its whole process tree
  # with packages/bench's sampler (the Electron main process as the root).
