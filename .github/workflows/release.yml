name: Release

# Building, signing and publishing are separate jobs (docs/adr/0057): repository code and its
# dependencies run without credentials or write access; tooling/release/sign.py from the default
# branch is the only code that sees Apple credentials, and only `publish` can write the Release.
# Every hand-off is an artifact, downloaded by the ID its upload recorded, whose SHA-256 the next
# job checks; the signer checks its own inputs and unpacks them as hostile.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  metadata:
    name: Tag and versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      nuget_version: ${{ steps.metadata.outputs.nuget_version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate tag and versions
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        # Tags: vX.Y.Z or vX.Y.Z-<alpha|beta|rc>.N (a prerelease); every release is signed.
        run: python3 -I tooling/release/metadata.py

  build:
    name: macOS arm64 build (no credentials)
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      bundle: ${{ steps.handoff.outputs.bundle }}
      bundle-id: ${{ steps.bundle.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Check runner prerequisites
        run: |
          test "$(uname -m)" = arm64
          xcrun --find SetFile
          uv python install 3.12
      - run: bun install --frozen-lockfile

      - name: Package release app, update ZIP, installer DMG and Daemon archives (unsigned)
        run: bun run --cwd apps/desktop package --release

      - name: Smoke-test packaged app
        timeout-minutes: 5
        run: node apps/desktop/scripts/packageCheck.ts

      - name: Hand off the unsigned app and Daemon with its digest
        id: handoff
        run: |
          # tar keeps the app's symlinks and modes, which artifacts drop; no AppleDouble files.
          COPYFILE_DISABLE=1 tar --no-mac-metadata -cf release-bundle.tar \
            apps/daemon/dist apps/desktop/out/dist/Polaris-darwin-arm64/Polaris.app
          echo "bundle=$(shasum -a 256 release-bundle.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: bundle
        with:
          name: release-bundle
          path: release-bundle.tar
          if-no-files-found: error
          retention-days: 3

  sign:
    name: Sign and notarise the Daemon and app
    needs: [metadata, build]
    runs-on: macos-15
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      bundle: ${{ steps.handoff.outputs.bundle }}
      assets: ${{ steps.handoff.outputs.assets }}
      daemon: ${{ steps.handoff.outputs.daemon }}
    defaults:
      run:
        shell: bash
    steps:
      # Only the reviewed signer and entitlements, from the default branch; nothing from the tag runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: signer
          persist-credentials: false
          sparse-checkout: |
            tooling/release/sign.py
            apps/desktop/scripts/packaging/entitlements
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.bundle-id }}
          path: handoff
          merge-multiple: true
      # The signer checks the tar against the build's digest and unpacks it into signed/,
      # which it creates; the hand-off and its digests come back in signed/.
      - name: Sign, notarise and staple the Daemon, the app and the update ZIP
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          BUNDLE_SHA256: ${{ needs.build.outputs.bundle }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          python3 -I signer/tooling/release/sign.py app
          --handoff handoff/release-bundle.tar
          --sha256 "$BUNDLE_SHA256"
          --out signed
          --entitlements signer/apps/desktop/scripts/packaging/entitlements
          --version "$VERSION"
      - name: Report the signed outputs' digests
        id: handoff
        run: cat signed/digests >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle-signed
          path: signed/handoff/release-bundle-signed.tar
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-daemon-dist-signed
          path: signed/handoff/polaris-daemon-dist.tar.gz
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-macos-signed
          path: signed/handoff/assets/
          if-no-files-found: error
          retention-days: 3

  dmg:
    name: Check the signed app and build its installer DMG (no credentials)
    needs: [metadata, sign]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      dmg: ${{ steps.handoff.outputs.dmg }}
      dmg-id: ${{ steps.upload.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: false
      - run: |
          xcrun --find SetFile
          uv python install 3.12
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle-signed
          path: handoff
      - name: Verify and unpack the signed app
        env:
          BUNDLE_SHA256: ${{ needs.sign.outputs.bundle }}
        run: |
          echo "$BUNDLE_SHA256  handoff/release-bundle-signed.tar" | shasum -a 256 -c -
          tar -xf handoff/release-bundle-signed.tar
      - name: Assess the signed app and Daemon
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          app=apps/desktop/out/dist/Polaris-darwin-arm64/Polaris.app
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose=2 "$app"
          # stapler asks Apple's CloudKit, which drops connections now and then: retry, then fail.
          for try in 1 2 3 4 5; do
            if xcrun stapler validate "$app"; then break; fi
            if [ "$try" -eq 5 ]; then exit 1; fi
            sleep $((15 * try))
          done
          daemon=apps/daemon/dist/darwin-arm64
          test "$("$daemon/polaris" selftest | head -n 1)" = "polaris $VERSION darwin-arm64"
          "$daemon/betterleaks" version
      - name: Smoke-test the signed app
        timeout-minutes: 5
        run: node apps/desktop/scripts/packageCheck.ts
      - name: Build the installer DMG around the signed app
        run: bun apps/desktop/scripts/dmg.ts
      - name: Hand off the DMG with its digest
        id: handoff
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mv "apps/desktop/out/dist/Polaris-$VERSION-arm64.dmg" .
          echo "dmg=$(shasum -a 256 "Polaris-$VERSION-arm64.dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: release-dmg
          path: Polaris-${{ needs.metadata.outputs.version }}-arm64.dmg
          if-no-files-found: error
          retention-days: 3

  sign-dmg:
    name: Sign and notarise the installer DMG
    needs: [metadata, dmg]
    runs-on: macos-15
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      assets: ${{ steps.handoff.outputs.assets }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: signer
          persist-credentials: false
          sparse-checkout: tooling/release/sign.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.dmg.outputs.dmg-id }}
          path: handoff
          merge-multiple: true
      - name: Sign, notarise and staple a checked copy of the DMG
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          DMG_SHA256: ${{ needs.dmg.outputs.dmg }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          python3 -I signer/tooling/release/sign.py dmg
          --dmg "handoff/Polaris-$VERSION-arm64.dmg"
          --sha256 "$DMG_SHA256"
          --out signed
      - name: Assess the DMG and report its digests
        id: handoff
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          spctl --assess --type open --context context:primary-signature --verbose=2 \
            "signed/assets/Polaris-$VERSION-arm64.dmg"
          cat signed/digests >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-dmg-signed
          path: signed/assets/
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Windows x64 and arm64 (experimental, unsigned)
    needs: [metadata, build, sign]
    # The Windows manifest must name the final darwin-arm64 bytes: the signed dist.
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      assets: ${{ steps.handoff.outputs.assets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Shared with windows-test-build.yml: restore the Daemon, package, smoke-test x64.
      - uses: ./.github/actions/package-windows
        with:
          daemon-artifact: release-daemon-dist-signed
          daemon-sha256: ${{ needs.sign.outputs.daemon }}
          release: "true"
      - name: Hand off the exact Windows assets with their digests
        id: handoff
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          NUGET_VERSION: ${{ needs.metadata.outputs.nuget_version }}
        run: |
          $assets = @()
          foreach ($arch in @('x64', 'arm64')) {
            $directory = "apps/desktop/out/dist/squirrel-$arch"
            $assets += "$directory/Polaris-$env:VERSION-$arch-win-Setup.exe"
            $assets += "$directory/Polaris-$arch-win-$env:NUGET_VERSION-full.nupkg"
            $assets += "$directory/Polaris-$env:VERSION-$arch-win-RELEASES"
          }
          New-Item -ItemType Directory assets | Out-Null
          $lines = foreach ($asset in $assets) {
            if (!(Test-Path $asset) -or (Get-Item $asset).Length -eq 0) { throw "Missing asset: $asset" }
            Copy-Item $asset assets/
            $name = Split-Path $asset -Leaf
            "$((Get-FileHash $asset -Algorithm SHA256).Hash.ToLower())  $name"
          }
          [IO.File]::WriteAllText("$PWD/assets/assets.sha256", (($lines -join "`n") + "`n"))
          $sums = (Get-FileHash assets/assets.sha256 -Algorithm SHA256).Hash.ToLower()
          "assets=$sums" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-windows
          path: assets/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installers
          path: |
            apps/desktop/out/dist/squirrel-x64/*
            apps/desktop/out/dist/squirrel-arm64/*
          if-no-files-found: error

  sdk:
    name: Build and pack the SDK (no credentials)
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.handoff.outputs.tarball }}
      tarball-id: ${{ steps.upload.outputs.artifact-id }}
      package: ${{ steps.handoff.outputs.package }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Build and pack the SDK
        run: bun run --cwd packages/sdk pack
      - name: Hand off the tarball with its digest
        id: handoff
        run: |
          tarballs=(packages/sdk/build/*.tgz)
          test "${#tarballs[@]}" -eq 1
          mv "${tarballs[0]}" polaris-sdk.tgz
          echo "tarball=$(sha256sum polaris-sdk.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "package=$(node -p 'const p = require("./packages/sdk/dist/package.json"); `${p.name}@${p.version}`')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: release-sdk
          path: polaris-sdk.tgz
          if-no-files-found: error
          retention-days: 3

  npm:
    name: Publish the SDK to npm with provenance
    needs: [metadata, sdk]
    runs-on: ubuntu-latest
    # Its own environment, so the owner can require a reviewer before anything reaches npm.
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      # Nothing from the tag runs here: the packed tarball is published as is, scripts ignored.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.sdk.outputs.tarball-id }}
          path: handoff
          merge-multiple: true
      - name: Publish the checked tarball unless its version is on npm
        # OIDC authenticates npm publish; there is no long-lived npm token.
        env:
          TARBALL_SHA256: ${{ needs.sdk.outputs.tarball }}
          PACKAGE: ${{ needs.sdk.outputs.package }}
        run: |
          set -euo pipefail
          # Node 24.22.1 bundles this npm; fail closed if the toolchain changes.
          test "$(npm --version)" = 11.19.1
          echo "$TARBALL_SHA256  handoff/polaris-sdk.tgz" | sha256sum --check --strict -
          # The SDK keeps its own version: a release that doesn't bump it publishes nothing.
          if npm view "$PACKAGE" version > /dev/null 2>&1; then
            echo "::notice::$PACKAGE is already on npm; nothing to publish."
            exit 0
          fi
          tag=latest
          if [[ "${PACKAGE##*@}" == *-* ]]; then tag=next; fi
          npm publish handoff/polaris-sdk.tgz --provenance --access public --ignore-scripts --tag "$tag"

  raycast:
    name: Build the Raycast extension (no credentials)
    # The standalone project installs @polaris/sdk from npm, so the SDK is published first.
    needs: [metadata, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      assets: ${{ steps.handoff.outputs.assets }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Build the standalone project from npm, as a user would, and pair it with a Daemon
        run: |
          bun extensions/raycast/scripts/e2e.ts "$RUNNER_TEMP/polaris-raycast"
          rm -rf "$RUNNER_TEMP/polaris-raycast/node_modules" "$RUNNER_TEMP/polaris-raycast/dist" \
            "$RUNNER_TEMP/polaris-raycast/raycast-env.d.ts"
      - name: Hand off the ZIP with its digest
        id: handoff
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir assets
          (cd "$RUNNER_TEMP" && zip -qrX "$GITHUB_WORKSPACE/assets/polaris-raycast-$VERSION.zip" polaris-raycast)
          (cd assets && sha256sum "polaris-raycast-$VERSION.zip" > assets.sha256)
          echo "assets=$(sha256sum assets/assets.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-raycast
          path: assets/
          if-no-files-found: error
          retention-days: 3

  even-g2:
    name: Pack the Even G2 app (no credentials; a workflow artifact, never a Release asset)
    needs: metadata
    # The whitelist names the owner's Hosts (repository variable EVEN_G2_HOSTS); without it, no package.
    if: vars.EVEN_G2_HOSTS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Pack the .ehpk for the configured Hosts
        env:
          EVEN_G2_HOSTS: ${{ vars.EVEN_G2_HOSTS }}
        # Hosts are separated by spaces, commas or newlines; pack.ts refuses anything not an origin.
        run: |
          set -euo pipefail
          args=()
          set -f
          for host in ${EVEN_G2_HOSTS//,/ }; do args+=(--host "$host"); done
          set +f
          test "${#args[@]}" -gt 0
          bun run --cwd extensions/even-g2 pack "${args[@]}"
          packages=(extensions/even-g2/build/polaris-g2-*.ehpk)
          test "${#packages[@]}" -eq 1
          sha256sum "${packages[@]}"
      # Uploaded and promoted by hand (extensions/even-g2/README.md): evenhub login has no CI path.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: polaris-g2-${{ needs.metadata.outputs.version }}
          path: |
            extensions/even-g2/build/polaris-g2-*.ehpk
            extensions/even-g2/build/app.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Create the draft GitHub Release with the exact assets
    needs: [metadata, sign, sign-dmg, windows, raycast]
    # A failed Windows or Raycast job still drafts the macOS assets and leaves the run red.
    if: >-
      always() && needs.sign.result == 'success' && needs.sign-dmg.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-macos-signed
          path: handoff/macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-dmg-signed
          path: handoff/dmg
      - if: needs.windows.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-windows
          path: handoff/windows
      - if: needs.raycast.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-raycast
          path: handoff/raycast
      - name: Create the draft from verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          MACOS_SHA256: ${{ needs.sign.outputs.assets }}
          DMG_SHA256: ${{ needs.sign-dmg.outputs.assets }}
          WINDOWS_SHA256: ${{ needs.windows.result == 'success' && needs.windows.outputs.assets || '' }}
          RAYCAST_SHA256: ${{ needs.raycast.result == 'success' && needs.raycast.outputs.assets || '' }}
        run: |
          set -euo pipefail
          assets=()
          # A hand-off's sums file must have the digest its job reported, and list every file in it.
          take() {
            echo "$2  handoff/$1/assets.sha256" | sha256sum --check --strict -
            (cd "handoff/$1" && sha256sum --check --strict assets.sha256)
            listed=$(cut -d' ' -f3 "handoff/$1/assets.sha256" | sort)
            present=$(cd "handoff/$1" && find . -mindepth 1 -maxdepth 1 ! -name assets.sha256 | sed 's|^\./||' | sort)
            test "$listed" = "$present"
            while read -r name; do assets+=("handoff/$1/$name"); done <<< "$listed"
          }
          take macos "$MACOS_SHA256"
          take dmg "$DMG_SHA256"
          if [[ -n "$WINDOWS_SHA256" ]]; then take windows "$WINDOWS_SHA256"; fi
          if [[ -n "$RAYCAST_SHA256" ]]; then
            take raycast "$RAYCAST_SHA256"
            test -s "handoff/raycast/polaris-raycast-$VERSION.zip"
          fi
          # Each platform's Daemon (polaris + betterleaks) and their checksums; Hosts download
          # these through polaris.lux.dev/api/daemon/<version>/<platform> (docs/adr/0043).
          test -s "handoff/macos/polaris-daemon-$VERSION-SHA256SUMS"
          daemons=(handoff/macos/polaris-daemon-"$VERSION"-*.tar.gz)
          test "${#daemons[@]}" -eq 6
          test -s "handoff/macos/polaris-daemon-$VERSION-windows-x64.tar.gz"
          test -s "handoff/macos/Polaris-$VERSION-arm64-mac.zip"
          ls handoff/*/"Polaris-$VERSION-arm64.dmg" > /dev/null
          flags=(--draft --verify-tag --title "Polaris $VERSION")
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease --latest=false)
          fi
          # Curated notes (docs/releases/<tag>.md at the tag) replace GitHub's generated ones.
          notes="$RUNNER_TEMP/release-notes.md"
          curated="$RUNNER_TEMP/curated.md"
          : > "$notes"
          if gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/docs/releases/$RELEASE_TAG.md?ref=$RELEASE_TAG" \
            > "$curated" 2> "$RUNNER_TEMP/notes-error"; then
            cat "$curated" >> "$notes"
          elif grep -q "HTTP 404" "$RUNNER_TEMP/notes-error"; then
            flags+=(--generate-notes)
          else
            cat "$RUNNER_TEMP/notes-error" >&2
            exit 1
          fi
          flags+=(--notes-file "$notes")
          for asset in "${assets[@]}"; do
            case "$asset" in *.ehpk) echo 'Even G2 packages cannot be Release assets' >&2; exit 1;; esac
          done
          gh release create "$RELEASE_TAG" "${assets[@]}" "${flags[@]}"
