name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: macOS arm64 draft
    runs-on: macos-15
    environment: release
    timeout-minutes: 90
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      nuget_version: ${{ steps.metadata.outputs.nuget_version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate tag, versions and signing policy
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Tags: vX.Y.Z (signed) or vX.Y.Z-<alpha|beta|rc>.N (a prerelease, may be unsigned).
        run: python3 -I tooling/release/metadata.py

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Check runner prerequisites
        run: |
          test "$(uname -m)" = arm64
          xcrun --find SetFile
          xcrun --find notarytool
          uv python install 3.12
      - run: bun install --frozen-lockfile

      - name: Import signing credentials
        id: signing
        if: steps.metadata.outputs.signed == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          umask 077
          signing_dir="$RUNNER_TEMP/polaris-signing"
          mkdir "$signing_dir"
          security list-keychains -d user > "$signing_dir/keychains.txt"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$signing_dir/certificate.p12"
          printf '%s' "$APPLE_API_KEY" > "$signing_dir/AuthKey.p8"
          keychain="$signing_dir/release.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/certificate.p12" -P "$MACOS_CERT_PASSWORD" \
            -k "$keychain" -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          python3 - <<'PY'
          import os, shlex, subprocess
          from pathlib import Path
          directory = Path(os.environ["RUNNER_TEMP"]) / "polaris-signing"
          original = shlex.split((directory / "keychains.txt").read_text())
          subprocess.run(["security", "list-keychains", "-d", "user", "-s",
                          str(directory / "release.keychain-db"), *original], check=True)
          PY
          rm "$signing_dir/certificate.p12"
          printf 'keychain=%s\napi_key=%s\n' "$keychain" "$signing_dir/AuthKey.p8" >> "$GITHUB_OUTPUT"

      - name: Package release app, Update ZIP and installer DMG
        env:
          APPLE_API_KEY: ${{ steps.signing.outputs.api_key }}
          MACOS_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run --cwd apps/desktop package --release

      - name: Smoke-test packaged app
        run: node apps/desktop/scripts/packageCheck.ts

      - name: Archive the final Daemon bytes and manifest for Windows
        # The manifest names every platform's Release archive; the archives themselves upload below.
        run: tar -czf polaris-daemon-dist.tar.gz --exclude dist/release -C apps/daemon dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-daemon-dist
          path: polaris-daemon-dist.tar.gz
          if-no-files-found: error

      - name: Assess signed app and validate stapled tickets
        if: steps.metadata.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          app=apps/desktop/out/dist/Polaris-darwin-arm64/Polaris.app
          dmg="apps/desktop/out/dist/Polaris-$VERSION-arm64.dmg"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          codesign --verify --strict "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"

      - name: Delete temporary signing credentials
        if: always() && steps.metadata.outputs.signed == 'true'
        run: |
          signing_dir="$RUNNER_TEMP/polaris-signing"
          trap 'rm -rf "$signing_dir"' EXIT
          python3 - <<'PY'
          import os, shlex, subprocess
          from pathlib import Path
          directory = Path(os.environ["RUNNER_TEMP"]) / "polaris-signing"
          try:
              saved = directory / "keychains.txt"
              if saved.exists():
                  subprocess.run(["security", "list-keychains", "-d", "user", "-s",
                                  *shlex.split(saved.read_text())], check=True)
          finally:
              keychain = directory / "release.keychain-db"
              if keychain.exists():
                  subprocess.run(["security", "delete-keychain", str(keychain)], check=True)
          PY

      - name: Create draft GitHub Release with exact feed assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.metadata.outputs.version }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          SIGNED: ${{ steps.metadata.outputs.signed }}
        run: |
          dmg="apps/desktop/out/dist/Polaris-$VERSION-arm64.dmg"
          zip="apps/desktop/out/dist/Polaris-$VERSION-arm64-mac.zip"
          test -s "$dmg"
          test -s "$zip"
          # Each platform's Daemon (polaris + betterleaks) and their checksums; Hosts download
          # these through polaris.lux.dev/api/daemon/<version>/<platform> (docs/adr/0043).
          daemons=(apps/daemon/dist/release/polaris-daemon-"$VERSION"-*.tar.gz)
          sums="apps/daemon/dist/release/polaris-daemon-$VERSION-SHA256SUMS"
          test "${#daemons[@]}" -eq 5
          for asset in "${daemons[@]}" "$sums"; do test -s "$asset"; done
          flags=(--draft --verify-tag --title "Polaris $VERSION")
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease --latest=false)
          fi
          # Curated notes (docs/releases/<tag>.md) replace GitHub's generated ones.
          curated="docs/releases/$RELEASE_TAG.md"
          notes="$RUNNER_TEMP/release-notes.md"
          : > "$notes"
          if [[ "$SIGNED" == false && ! -f "$curated" ]]; then
            printf '%s\n\n' 'Unsigned prerelease for testing. Signing and notarisation were skipped.' >> "$notes"
          fi
          if [[ -f "$curated" ]]; then
            cat "$curated" >> "$notes"
          else
            flags+=(--generate-notes)
          fi
          flags+=(--notes-file "$notes")
          gh release create "$RELEASE_TAG" "$dmg" "$zip" "${daemons[@]}" "$sums" "${flags[@]}"

  windows:
    name: Windows x64 and arm64 (experimental, unsigned)
    needs: release
    runs-on: windows-latest
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Shared with windows-test-build.yml: restore the Daemon, package, smoke-test x64.
      - uses: ./.github/actions/package-windows
        with:
          daemon-artifact: release-daemon-dist
          release: "true"
      - name: Upload exact Windows assets to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.release.outputs.version }}
          NUGET_VERSION: ${{ needs.release.outputs.nuget_version }}
        run: |
          $assets = @()
          foreach ($arch in @('x64', 'arm64')) {
            $directory = "apps/desktop/out/dist/squirrel-$arch"
            $assets += "$directory/Polaris-$env:VERSION-$arch-win-Setup.exe"
            $assets += "$directory/Polaris-$arch-win-$env:NUGET_VERSION-full.nupkg"
            $assets += "$directory/Polaris-$env:VERSION-$arch-win-RELEASES"
          }
          foreach ($asset in $assets) {
            if (!(Test-Path $asset) -or (Get-Item $asset).Length -eq 0) { throw "Missing asset: $asset" }
          }
          gh release upload $env:RELEASE_TAG @assets
          if ($LASTEXITCODE -ne 0) { throw 'Windows asset upload failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installers
          path: |
            apps/desktop/out/dist/squirrel-x64/*
            apps/desktop/out/dist/squirrel-arm64/*
          if-no-files-found: error
