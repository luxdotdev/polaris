name: Nightly build

# A signed build of main each night (ENG-976, docs/adr/0057): the newest main commit whose required
# lane (the CI check) passed becomes vX.Y.Z-nightly.YYYYMMDD, the next patch's prerelease, so the
# Stable Release supersedes it. release.yml builds and signs it (environment `nightly`: main only,
# no reviewer) and publishes a prerelease, macOS and Windows only. Nights with nothing new since the
# last nightly are skipped; the newest 7 nightlies are kept. By hand: gh workflow run nightly-build.yml
#   plan     tooling/release/nightly.py plan: the commit, the version, or why tonight is skipped.
#   tag      commits the version onto that commit and pushes only the tag (never moved; a retry
#            reuses today's unreleased tag of the same bump); main never moves.
#   release  release.yml at the tag's commit by SHA (publish refuses a moved tag), channel nightly.
#   prune    deletes nightlies past the newest 7, and tags of failed nights (not tonight's).

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-build
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    name: Pick the commit and the version
    # The nightly environment admits only main; a run from a branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: tooling/release/nightly.py
          sparse-checkout-cone-mode: false
      - name: Plan tonight's nightly
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # bash sets pipefail: a failing planner must fail here, not look like a skip.
        shell: bash
        run: python3 -I tooling/release/nightly.py plan | tee -a "$GITHUB_STEP_SUMMARY"

  tag:
    name: Tag the commit with the nightly version
    needs: plan
    if: needs.plan.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # The tag's commit sits on main's commit (nightly.py plan reads its parent). A tag is never
      # moved: today's unreleased tag of this commit's bump is reused, any other unreleased one deleted.
      - name: Commit the version and push the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          SOURCE: ${{ needs.plan.outputs.sha }}
        run: python3 -I tooling/release/nightly.py tag --version "$VERSION" --tag "$TAG" --source "$SOURCE"

  release:
    name: Release
    needs: [plan, tag]
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      channel: nightly
      sha: ${{ needs.tag.outputs.sha }}
    # Environment secrets must be passed by name; their values come from the `nightly` environment,
    # in release.yml's signing jobs only. Never `inherit`.
    secrets:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    # A called workflow's jobs get at most these. id-token is only for release.yml's npm job,
    # which a nightly skips; GitHub refuses the call without it.
    permissions:
      contents: write
      id-token: write

  prune:
    name: Keep the newest 7 nightlies
    needs: [plan, release]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.skip == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: tooling/release/nightly.py
          sparse-checkout-cone-mode: false
      - name: Delete older nightlies and failed nights' tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: python3 -I tooling/release/nightly.py prune --keep 7 --current "$TAG"
