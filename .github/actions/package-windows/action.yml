name: Package Windows installers
description: >-
  Restores a Daemon dist archived by a macOS job, packages the Desktop App for Windows x64 and
  arm64 with Squirrel installers (unsigned), and smoke-tests the x64 install. Shared by the
  release and the Windows test-build workflows; run it after actions/checkout on windows-latest.
inputs:
  daemon-artifact:
    description: The artifact holding polaris-daemon-dist.tar.gz (apps/daemon/dist).
    required: true
  daemon-sha256:
    description: The SHA-256 of polaris-daemon-dist.tar.gz that the producing job reported.
    required: true
  release:
    description: "'true' packages a release (versions must match the tag); 'false' a dev build."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24
    - shell: pwsh
      run: bun install --frozen-lockfile
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.daemon-artifact }}
        path: .
    - name: Restore the macOS job's Daemon artifact without rebuilding or signing
      shell: pwsh
      env:
        EXPECTED: ${{ inputs.daemon-sha256 }}
      run: |
        $actual = (Get-FileHash polaris-daemon-dist.tar.gz -Algorithm SHA256).Hash.ToLower()
        if ($actual -ne $env:EXPECTED) { throw "Daemon artifact digest $actual is not $env:EXPECTED" }
        tar -xzf polaris-daemon-dist.tar.gz -C apps/daemon
    - name: Package both Windows architectures and Squirrel installers
      shell: pwsh
      env:
        RELEASE: ${{ inputs.release }}
      run: |
        $flags = @('--windows', '--reuse-daemon')
        if ($env:RELEASE -eq 'true') { $flags += '--release' }
        bun run --cwd apps/desktop package @flags
        if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
    - name: Install the x64 app, check it carries this PC's Daemon, verify a window opens, reach that Daemon over its pipe, and connect the app to This PC
      shell: pwsh
      run: |
        $installers = @(Get-ChildItem 'apps/desktop/out/dist/squirrel-x64' -Filter '*-x64-win-Setup.exe')
        if ($installers.Count -ne 1) { throw "Expected one x64 installer, found $($installers.Count)" }
        ./apps/desktop/scripts/packaging/windows-smoke.ps1 -Installer $installers[0].FullName -Arch x64
